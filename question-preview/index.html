<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>牛马测试｜问题预览</title>
<style>
:root{--paper:#fff8e8;--ink:#25211d;--pink:#f5a6bd;--yellow:#ffd873;--blue:#cfe8f5;--green:#dcecc9;--muted:#7b746b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background-image:radial-gradient(rgba(60,45,25,.05) .8px,transparent .8px);background-size:7px 7px}.app{width:min(760px,94vw);margin:0 auto;padding:14px 0 44px}.card{background:#fffdf6;border:2.5px solid var(--ink);border-radius:26px;box-shadow:7px 8px 0 rgba(40,34,28,.10);padding:18px}.top{display:flex;align-items:center;justify-content:space-between;font-weight:900}.progress{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:12px 0 20px;background:#fff}.progress>i{display:block;height:100%;background:var(--pink);width:0;transition:.25s}.q{font-size:clamp(23px,5.5vw,32px);font-weight:900;line-height:1.45;white-space:pre-line;margin-bottom:15px}.scene{min-height:180px;border:2px solid var(--ink);border-radius:21px;background:linear-gradient(180deg,#f7eddc,#efe2ca);padding:18px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:15px;position:relative;overflow:hidden}.scene:before{content:"手绘场景图位置";position:absolute;top:16px;left:16px;font-size:12px;color:var(--muted);transform:rotate(-2deg)}.scene .cow{font-size:64px;filter:grayscale(1);opacity:.15}.choices{display:grid;gap:10px}.choice{width:100%;border:2px solid var(--ink);border-radius:17px;background:#fff;padding:13px 14px;text-align:left;font-size:15px;line-height:1.6;font-weight:750;display:grid;grid-template-columns:34px 1fr;gap:9px;cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.08)}.choice:nth-child(1) .letter{background:#ffd0df}.choice:nth-child(2) .letter{background:#ffe59a}.choice:nth-child(3) .letter{background:var(--blue)}.choice:nth-child(4) .letter{background:var(--green)}.letter{width:31px;height:31px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:1000}.choice.sel{background:#fff0f5;transform:translateX(2px)}.feedback{display:none;margin-top:14px;border:2px dashed var(--ink);border-radius:18px;padding:13px 14px;background:#f7efce;line-height:1.65;font-weight:800}.feedback.show{display:block}.feedback b{display:block;margin-bottom:4px}.next{display:none;margin:14px auto 0;border:2px solid var(--ink);border-radius:16px;background:var(--yellow);padding:11px 18px;font-weight:900;cursor:pointer}.next.show{display:block}.done{text-align:center;padding:34px 12px}.done h2{font-size:32px}.small{font-size:12px;color:var(--muted)}@media(max-width:520px){.card{padding:15px}.scene{min-height:150px}.choice{font-size:14px}}
</style>
</head>
<body><main class="app"><section class="card" id="quiz"><div class="top"><span id="count">01 / 12</span><span>问题预览版</span></div><div class="progress"><i id="bar"></i></div><div class="q" id="q"></div><div class="scene"><div class="cow">牛</div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="next">下一题 →</button></section></main>
<script>
const qs=[
{q:'老板凌晨 1:37：“睡了吗？有个小事。”',a:[['老板您先加会儿班，我还在梦里。','睡眠边界清晰，建议公司自行消化小事。'],['没睡老板，我在等您。','紧急下调你的清醒评级。建议检查职业灵魂是否仍属本人。'],['晚上 8 点后，来电自动转接同事。\n同事目前并不知情。','边界感优秀，同事情绪暂不纳入本次评级。'],['老板，我还在公司。\n你怎么下班了？','经核实，你比老板更像老板。建议重新检查组织架构。']]},
{q:'HR 通知：今年没有年终奖。',a:[['没事，我会自己赚回来。\n11点上班，吃两小时饭，3点准备下班。','现金流承压，工作热情同步进入技术性调整。'],['老板肯定也很难。','委员会紧急下调你的清醒评级。'],['冲进老板办公室：\n“那你给我画的饼今年算主食吗？”','沟通直接，建议财务部提前准备胃药。'],['坏消息来晚了一步。\n你刚跳槽成功，涨薪 40%。','本委员会怀疑你偷偷持有职场内幕消息。']]},
{q:'两个部门突然在大群里吵起来了。',a:[['开始整理时间线。\n吃瓜也要有专业精神。','信息归档能力优秀，动机暂不评价。'],['私聊其中一方：\n“其实有句话，我不知道该不该跟你说……”\n然后说了。','已确认：你对局势稳定的贡献接近于零。'],['@老板：您要不说两句？\n然后下班了。','责任成功升级，人员成功撤离。'],['“哈哈哈哈他们打起来了。”\n结果发到了公司大群。','事故已发生。你本人仍处于震惊状态。']]},
{q:'新同事入职第一天，偷偷问你：“这公司怎么样？”',a:[['拉他坐下。\n“你几点下班？我从头跟你讲。”','新人保护机制自动启动。'],['打开组织架构。\n半小时后已经讲到三年前的宫斗。','信息密度过高，建议新人先补充水分。'],['“挺好的呀，大家人都很好。”','谁不好我晚点微信告诉你。'],['“我都待五年了。”\n新人：“那一定很好吧？”\n“不是，我有房贷。”','忠诚度评级维持，原因已被财务因素充分解释。']]},
{q:'会上老板问：“有人了解这个吗？”\n你：“我知道一点。”\n老板：“好，那你负责。”',a:[['立刻补充：“其实王总比我更熟。”\n王总缓缓抬头。','知识共享完成，友情评级待观察。'],['从此开会再也不说话。','成长发生得非常突然。'],['项目黄了，赛道火了。\n简历上：0→1 战略项目负责人。\n后来成功跳槽。','项目生命周期结束，你的职业生命周期刚刚开始。'],['接了。\n第二天老板离职。\n那就不用做了。','任务状态：自然死亡。']]},
{q:'你已经第 47 次决定辞职。现在进行到哪一步？',a:[['打开银行 App。\n等年终奖之后再走。','委员会认定：离职计划受现金流强约束。'],['辞职信写好了。\n定时发送：明天 9:00。\n8:59，取消发送。','辞职完成率 99%，最后 1% 由房贷接管。'],['不辞了。\n决定把公司熬倒。','战略由撤退调整为长期消耗战。'],['真辞了。\n第二周收到一个涨薪 50% 的 offer。','本委员会申请复核你的命格。']]},
{q:'你发现 AI 已经能做掉你 90% 的工作。',a:[['主动跟老板汇报：效率提升了 90%。','恭喜，效率提升已被公司成功回收。'],['开始同时指挥 ChatGPT、Claude、Gemini。\n第一次体会到了当老板的感觉。','组织架构虽未更新，你已拥有地下部门。'],['工作 30 分钟做完。\n剩下 7.5 小时保持 Teams 绿色。','产出完成，生命体征维持正常。'],['“那公司还要我干嘛？”\n开始认真研究被裁能赔多少。','风险意识良好，职业安全感进入观察名单。']]},
{q:'忙完一个大项目，老板只说了一句：“辛苦了。”',a:[['“辛苦费什么时候发？”\n突然发现群里安静了。','问题非常合理，场面暂时不太合理。'],['“不辛苦。”\n说完突然反应过来：\n不对，我挺辛苦的。','自我感受延迟到账。'],['“老板您更辛苦。”\n年底你升职了。','向上管理评级上调，同事正在重新研究这句话。']]},
{q:'你已经准备下班了，老板突然说：“大家先别走，有个小事。”',a:[['“没问题。”\n加完班打开打车软件：前方排队 100 人。','对公司的恨终于获得了具体价格。'],['老板讲了十分钟。\n散会后把录音发给 AI：\n“总结一下，他到底要什么？”','信息处理方式先进，注意力去向不明。'],['本来准备摆脸色。\n老板：“明天上午可以晚点来。”\n你的脸当场恢复了企业文化。','补偿机制有效，企业文化已快速修复。']]},
{q:'你偷偷约了一个面试，结果和老板临时叫你的会撞了。',a:[['把面试改期了。\n老板并不知道自己刚刚成功续约了一名员工。','公司留才机制在毫不知情的情况下成功运转。'],['两个都参加。\n公司会议开着麦，面试开着摄像头。','职业生涯首次实现真正的 multitasking。'],['说自己不舒服，想请假。\n实际上确实不舒服——\n对现在这份工作不舒服。','症状属实，病因暂不便向老板披露。']]},
{q:'公司突然通知：从明天开始，你可以自己选老板。',a:[['“可以不选吗？”','制度给了选择，你选择退出选择。'],['开始研究每个老板过去三年的晋升记录。\n谁能带我升职比较重要。','决策高度理性，情感因素已剔除。'],['选了全公司公认最难搞的那个。\n因为他手上有最好的项目。','风险偏好上调，收益目标同步上调。'],['“那我能选自己吗？”','问题已超出 HR 原始设计范围。']]},
{q:'你中了 1000 万。第二天早上，老板问：“在线吗？”',a:[['“在的老板，什么事？”\n发完三秒后突然坐直：\n等一下，我不是有 1000 万了吗？','财富已经自由，牛马系统仍在后台运行。'],['“在，但以后不一定了。”\n然后认真把手上的工作交接完。','经委员会确认：该牛马已具备放归自然条件。'],['没回。\n因为你正在去机场的路上。\n老板：“人呢？”\n“人在奔向美好生活。”','恭喜，该员工已成功从公司资产转为自然人。'],['“在。正好我也有件事想跟你聊。”\n半小时后，你从员工变成公司潜在投资人。','有些牛马获得自由后，第一反应是自己开牧场。']]}
];
let i=0,locked=false;const q=document.getElementById('q'),choices=document.getElementById('choices'),fb=document.getElementById('feedback'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar');
function render(){locked=false;fb.className='feedback';next.className='next';count.textContent=String(i+1).padStart(2,'0')+' / '+qs.length;bar.style.width=((i)/qs.length*100)+'%';q.textContent=qs[i].q;choices.innerHTML='';qs[i].a.forEach((x,n)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span>'+x[0].replaceAll('\n','<br>')+'</span>';b.onclick=()=>{if(locked)return;locked=true;b.classList.add('sel');[...choices.children].forEach(z=>z.disabled=true);fb.innerHTML='<b>牛马国际评级委员会：</b>'+x[1];fb.classList.add('show');next.classList.add('show');bar.style.width=((i+1)/qs.length*100)+'%'};choices.appendChild(b)})}
next.onclick=()=>{i++;if(i>=qs.length){document.getElementById('quiz').innerHTML='<div class="done"><h2>12 题结束</h2><p>这一版只预览问题与点击反馈，不出最终人格。</p><p class="small">正式版首页保持不变。</p></div>';return}render()};render();
</script></body></html>
