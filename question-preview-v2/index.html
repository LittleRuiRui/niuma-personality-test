<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>牛马测试｜算法预览</title><style>
:root{--paper:#fff8e8;--ink:#25211d;--pink:#f5a6bd;--yellow:#ffd873;--blue:#cfe8f5;--green:#dcecc9;--muted:#7b746b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background-image:radial-gradient(rgba(60,45,25,.05) .8px,transparent .8px);background-size:7px 7px}.app{width:min(760px,94vw);margin:0 auto;padding:14px 0 44px}.card{background:#fffdf6;border:2.5px solid var(--ink);border-radius:26px;box-shadow:7px 8px 0 rgba(40,34,28,.10);padding:18px}.top{display:flex;justify-content:space-between;font-weight:900}.progress{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:12px 0 20px;background:#fff}.progress i{display:block;height:100%;background:var(--pink);transition:.25s}.q{font-size:clamp(23px,5.5vw,32px);font-weight:900;line-height:1.45;white-space:pre-line;margin-bottom:16px}.choices{display:grid;gap:10px}.choice{width:100%;border:2px solid var(--ink);border-radius:17px;background:#fff;padding:13px 14px;text-align:left;font-size:15px;line-height:1.6;font-weight:750;display:grid;grid-template-columns:34px 1fr;gap:9px;cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.08)}.choice:nth-child(1) .letter{background:#ffd0df}.choice:nth-child(2) .letter{background:#ffe59a}.choice:nth-child(3) .letter{background:var(--blue)}.choice:nth-child(4) .letter{background:var(--green)}.letter{width:31px;height:31px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:1000}.choice.sel{background:#fff0f5;transform:translateX(2px)}.feedback{display:none;margin-top:14px;border:2px dashed var(--ink);border-radius:18px;padding:13px 14px;background:#f7efce;line-height:1.65;font-weight:800}.feedback.show{display:block}.feedback b{display:block;margin-bottom:4px}.next{display:none;margin:14px auto 0;border:2px solid var(--ink);border-radius:16px;background:var(--yellow);padding:11px 18px;font-weight:900;cursor:pointer}.next.show{display:block}.result{display:none}.result.show{display:block}.badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:900}.code{font-size:clamp(58px,16vw,96px);font-weight:1000;color:#ef83a5;line-height:1;margin:13px 0 2px;text-shadow:2px 2px 0 var(--ink)}h1,h2,p{margin-top:0}.subtitle{font-size:28px;font-weight:950}.punch{background:#ffdce7;border:2px solid var(--ink);border-radius:18px;padding:16px;font-size:19px;font-weight:900;line-height:1.6;margin:16px 0}.diag{font-size:15px;line-height:1.85;font-weight:650}.meterbox{margin-top:18px;border:2px solid var(--ink);border-radius:18px;padding:15px;background:#fff}.meterhead{display:flex;justify-content:space-between;align-items:end}.score{font-size:34px;font-weight:1000}.meter{height:18px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:10px 0;background:#fff}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));width:0}.cowcopy{font-weight:900;line-height:1.6}.secondary{margin-top:15px;border:2px solid var(--ink);background:#fff;border-radius:15px;padding:11px 15px;font-weight:900}.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}@media(max-width:520px){.card{padding:15px}.choice{font-size:14px}}
</style></head><body><main class="app"><section class="card" id="quiz"><div class="top"><span id="count">01 / 12</span><span>算法预览版</span></div><div class="progress"><i id="bar"></i></div><div class="q" id="q"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="next">下一题 →</button></section><section class="card result" id="result"></section></main><script>
const TYPES={BULL:{name:'牛来 · 职场紫微星',punch:'努力是真的。命好也是真的。',desc:'你不是单纯乐观，而是经常能在关键节点接住机会。项目、贵人、跳槽、风口，总有东西在你快掉下去时托你一下。',share:'这头牛最后还真混出来了。'},MAMA:{name:'牛妈 · 团队妈妈',punch:'公司没给你管理岗，但你已经养了半个部门。',desc:'你会提醒 deadline、补漏洞、收残局，也会在别人第一天入职时主动告诉他哪里有坑。团队没有正式任命你，但日常运行已经默认把你算进基础设施。'},DOGE:{name:'老板爱犬 · 天选老板缘',punch:'你不是舔，你只是非常擅长识别权力的投喂方向。',desc:'你对老板真正关心什么有异常敏锐的判断。你未必最辛苦，但常常知道什么时候说什么、做什么最有效。'},FISH:{name:'摸鱼大师 · 带薪自由人',punch:'公司买走了你的时间，没有成功捕获你的灵魂。',desc:'你追求的不是不工作，而是不浪费生命。活能交，锅尽量不背，多出来的时间属于你自己。'},POOR:{name:'贫困牛 · 房贷战略合作伙伴',punch:'不是忠诚，是房贷。',desc:'你并非没有离开的想法，只是银行卡经常比理想更有投票权。你和公司的关系，本质上是一场由现金流维持的长期合作。'},QUIT:{name:'辞职人 · 脑内离职专家',punch:'今天也辞职了。明天记得打卡。',desc:'你已经在脑内离开过很多次。辞职信、下一份工作、自由生活都很完整，只差真正点下发送。'},DEAD:{name:'工位遗体 · Teams 在线生命体',punch:'生命体征以 Teams 绿点为准。',desc:'你的肉体还在公司系统里，精神已经提前下班。你仍然可以交付，但主要依靠惯性、日历提醒和电脑在线状态维持。'},FAKE:{name:'职场伪人 · 表面 Professional',punch:'“好的老板😊”是你最成功的人格面具。',desc:'你非常懂职场表面秩序。嘴上专业、表情稳定、邮件得体，真正的弹幕只在脑内滚动。'},MESS:{name:'拱火大师 · 办公室局势观察员',punch:'你不制造混乱，你只是偶尔给混乱递个麦。',desc:'公司越乱，你的信息处理速度越快。别人看到冲突想逃，你已经开始整理时间线、补充背景并寻找最佳观赏角度。'},BOSS:{name:'野生老板 · 在职创业型人格',punch:'上班最大的痛苦，是老板不是我。',desc:'你真正不适应的不是工作本身，而是很多决定为什么不是你来做。只要规则允许，你很容易从员工视角切换到资源配置者视角。'},AIYA:{name:'赛博牛马 · AI 地下部门负责人',punch:'公司以为你是一个员工，其实你是一个小型咨询公司。',desc:'你不是偶尔用 AI，而是已经把工作拆成了可以分派给多个模型的小型组织。老板看到的是一个人，背后实际上站着一支赛博团队。'},CHAOS:{name:'事故圣体 · 职场自然灾害',punch:'你不是职场搅屎棍。你是职场自然灾害。',desc:'你未必主动搞事，但事情来到你身边后，总有概率突然变大。你本人经常也是最后一个知道发生了什么的人。'}};
const P=Object.keys(TYPES);
const qs=[
{q:'老板凌晨 1:37：“睡了吗？有个小事。”',a:[['老板您先加会儿班，我还在梦里。','睡眠边界清晰，建议公司自行消化小事。',{BOSS:3,FISH:2},-20],['没睡老板，我在等您。','紧急下调你的清醒评级。建议检查职业灵魂是否仍属本人。',{DOGE:3,MAMA:2},30],['晚上 8 点后，来电自动转接同事。\n同事目前并不知情。','边界感优秀，同事情绪暂不纳入本次评级。',{FISH:4,MESS:1},-20],['老板，我还在公司。\n你怎么下班了？','经核实，你比老板更像老板。建议重新检查组织架构。',{BULL:3,MAMA:2,BOSS:2},-10]]},
{q:'HR 通知：今年没有年终奖。',a:[['没事，我会自己赚回来。\n11点上班，吃两小时饭，3点准备下班。','现金流承压，工作热情同步进入技术性调整。',{FISH:4},-10],['老板肯定也很难。','委员会紧急下调你的清醒评级。',{DOGE:3,MAMA:2},20],['冲进老板办公室：\n“那你给我画的饼今年算主食吗？”','沟通直接，建议财务部提前准备胃药。',{BOSS:3,MESS:2},-20],['坏消息来晚了一步。\n你刚跳槽成功，涨薪 40%。','本委员会怀疑你偷偷持有职场内幕消息。',{BULL:4},-10]]},
{q:'两个部门突然在大群里吵起来了。',a:[['开始整理时间线。\n吃瓜也要有专业精神。','信息归档能力优秀，动机暂不评价。',{MESS:3,BOSS:1},0],['私聊其中一方：\n“其实有句话，我不知道该不该跟你说……”\n然后说了。','已确认：你对局势稳定的贡献接近于零。',{MESS:4,FAKE:1},-10],['@老板：您要不说两句？\n然后下班了。','责任成功升级，人员成功撤离。',{FISH:4},-10],['“哈哈哈哈他们打起来了。”\n结果发到了公司大群。','事故已发生。你本人仍处于震惊状态。',{CHAOS:4,MESS:1},-20]]},
{q:'新同事入职第一天，偷偷问你：“这公司怎么样？”',a:[['拉他坐下。\n“你几点下班？我从头跟你讲。”','新人保护机制自动启动。',{MAMA:4},10],['打开组织架构。\n半小时后已经讲到三年前的宫斗。','信息密度过高，建议新人先补充水分。',{MESS:3,BOSS:1},0],['“挺好的呀，大家人都很好。”','谁不好我晚点微信告诉你。',{FAKE:3,MESS:2},10],['“我都待五年了。”\n新人：“那一定很好吧？”\n“不是，我有房贷。”','忠诚度评级维持，原因已被财务因素充分解释。',{POOR:4},20]]},
{q:'会上老板问：“有人了解这个吗？”\n你：“我知道一点。”\n老板：“好，那你负责。”',a:[['立刻补充：“其实王总比我更熟。”\n王总缓缓抬头。','知识共享完成，友情评级待观察。',{FISH:3,MESS:2},-10],['从此开会再也不说话。','成长发生得非常突然。',{DEAD:3,FISH:2},10],['项目黄了，赛道火了。\n简历上：0→1 战略项目负责人。\n后来成功跳槽。','项目生命周期结束，你的职业生命周期刚刚开始。',{BULL:3,FAKE:2},-10],['接了。\n第二天老板离职。\n那就不用做了。','任务状态：自然死亡。',{CHAOS:4,FISH:1},0]]},
{q:'你已经第 47 次决定辞职。现在进行到哪一步？',a:[['打开银行 App。\n等年终奖之后再走。','委员会认定：离职计划受现金流强约束。',{POOR:4,QUIT:2},20],['辞职信写好了。\n定时发送：明天 9:00。\n8:59，取消发送。','辞职完成率 99%，最后 1% 由房贷接管。',{QUIT:4,POOR:2},20],['不辞了。\n决定把公司熬倒。','战略由撤退调整为长期消耗战。',{DEAD:3,BOSS:2},0],['真辞了。\n第二周收到一个涨薪 50% 的 offer。','本委员会申请复核你的命格。',{BULL:4,QUIT:1},-20]]},
{q:'你发现 AI 已经能做掉你 90% 的工作。',a:[['主动跟老板汇报：效率提升了 90%。','恭喜，效率提升已被公司成功回收。',{MAMA:3,DEAD:2},20],['开始同时指挥 ChatGPT、Claude、Gemini。\n第一次体会到了当老板的感觉。','组织架构虽未更新，你已拥有地下部门。',{AIYA:4,BOSS:2},-10],['工作 30 分钟做完。\n剩下 7.5 小时保持 Teams 绿色。','产出完成，生命体征维持正常。',{FISH:4,FAKE:2},-10],['“那公司还要我干嘛？”\n开始认真研究被裁能赔多少。','风险意识良好，职业安全感进入观察名单。',{POOR:3,QUIT:2},10]]},
{q:'忙完一个大项目，老板只说了一句：“辛苦了。”',a:[['“辛苦费什么时候发？”\n突然发现群里安静了。','问题非常合理，场面暂时不太合理。',{BOSS:3,CHAOS:2},-20],['“不辛苦。”\n说完突然反应过来：\n不对，我挺辛苦的。','自我感受延迟到账。',{MAMA:3,DEAD:2},10],['“老板您更辛苦。”\n老板：“还是你懂我。”\n年底你升职了。','向上管理评级上调，同事正在重新研究这句话。',{DOGE:4,BULL:2},20]]},
{q:'你已经准备下班了，老板突然说：“大家先别走，有个小事。”',a:[['“没问题。”\n加完班打开打车软件：前方排队 100 人。','对公司的恨终于获得了具体价格。',{POOR:3,DEAD:2},20],['老板讲了十分钟。\n散会后把录音发给 AI：\n“总结一下，他到底要什么？”','信息处理方式先进，注意力去向不明。',{AIYA:3,FISH:2},-10],['本来准备摆脸色。\n老板：“明天上午可以晚点来。”\n你的脸当场恢复了企业文化。','补偿机制有效，企业文化已快速修复。',{DOGE:3,MAMA:2},10]]},
{q:'你偷偷约了一个面试，结果和老板临时叫你的会撞了。',a:[['把面试改期了。\n老板并不知道自己刚刚成功续约了一名员工。','公司留才机制在毫不知情的情况下成功运转。',{POOR:3,DOGE:2},20],['两个都参加。\n公司会议开着麦，面试开着摄像头。','职业生涯首次实现真正的 multitasking。',{AIYA:3,CHAOS:3},-10],['说自己不舒服，想请假。\n实际上确实不舒服——\n对现在这份工作不舒服。','症状属实，病因暂不便向老板披露。',{FAKE:3,QUIT:2},-10]]},
{q:'公司突然通知：从明天开始，你可以自己选老板。',a:[['“可以不选吗？”','制度给了选择，你选择退出选择。',{FISH:3,QUIT:2},-10],['开始研究每个老板过去三年的晋升记录。\n跟谁不重要，谁能带我升职比较重要。','决策高度理性，情感因素已剔除。',{DOGE:4,BOSS:1},10],['选了全公司公认最难搞的那个。\n因为他手上有最好的项目。','风险偏好上调，收益目标同步上调。',{BULL:3,BOSS:2},-20],['“那我能选自己吗？”','问题已超出 HR 原始设计范围。',{BOSS:4},-40]]},
{q:'你中了 1000 万。第二天早上，老板问：“在线吗？”',a:[['“在的老板，什么事？”\n发完三秒后突然坐直：\n等一下，我不是有 1000 万了吗？','财富已经自由，牛马系统仍在后台运行。',{DOGE:3,DEAD:1},30],['“在，但以后不一定了。”\n然后认真把手上的工作交接完。','经委员会确认：该牛马已具备放归自然条件。',{QUIT:3,MAMA:2},-20],['没回。\n因为你正在去机场的路上。\n老板：“人呢？”\n“人在奔向美好生活。”','恭喜，该员工已成功从公司资产转为自然人。',{BULL:3,QUIT:2},-40],['“在。正好我也有件事想跟你聊。”\n半小时后，你从员工变成公司潜在投资人。','有些牛马获得自由后，第一反应是自己开牧场。',{BOSS:4,BULL:2},-50]]}
];
const baseline={};P.forEach(p=>{let mu=0,v=0;qs.forEach(q=>{const xs=q.a.map(a=>(a[2][p]||0)),m=xs.reduce((x,y)=>x+y,0)/xs.length;mu+=m;v+=xs.reduce((s,x)=>s+(x-m)*(x-m),0)/xs.length});baseline[p]={mu,sd:Math.sqrt(v)||1}});
let i=0,locked=false,coward=50;const raw=Object.fromEntries(P.map(p=>[p,0])),support=Object.fromEntries(P.map(p=>[p,0])),strong=Object.fromEntries(P.map(p=>[p,0]));const qel=document.getElementById('q'),choices=document.getElementById('choices'),fb=document.getElementById('feedback'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar');
function render(){locked=false;fb.className='feedback';next.className='next';count.textContent=String(i+1).padStart(2,'0')+' / '+qs.length;bar.style.width=(i/qs.length*100)+'%';qel.textContent=qs[i].q;choices.innerHTML='';qs[i].a.forEach((x,n)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span>'+x[0].replaceAll('\n','<br>')+'</span>';b.onclick=()=>choose(b,x);choices.appendChild(b)})}
function choose(b,x){if(locked)return;locked=true;b.classList.add('sel');[...choices.children].forEach(z=>z.disabled=true);Object.entries(x[2]).forEach(([p,s])=>{raw[p]+=s;if(s>=2)support[p]++;if(s>=3)strong[p]++});coward+=x[3];fb.innerHTML='<b>牛马国际评级委员会：</b>'+x[1];fb.classList.add('show');next.classList.add('show');bar.style.width=((i+1)/qs.length*100)+'%'}
next.onclick=()=>{i++;if(i>=qs.length)showResult();else render()};
function eligible(p){if(p==='AIYA')return support[p]>=2&&strong[p]>=1;if(['BULL','MESS','CHAOS'].includes(p))return support[p]>=2;return true}
function cowLabel(v){if(v<=20)return'反骨突出，建议管理层谨慎接触。';if(v<=40)return'尚有尊严，偶尔低头。';if(v<=60)return'能屈能伸，标准牛马。';if(v<=80)return'窝囊稳定，具备长期就业价值。';return'天选忍人，老板看了很安心。'}
function showResult(){document.getElementById('quiz').style.display='none';const ranked=P.map(p=>({p,z:(raw[p]-baseline[p].mu)/baseline[p].sd})).filter(x=>eligible(x.p)).sort((a,b)=>b.z-a.z);const win=ranked[0]||{p:'FISH'},t=TYPES[win.p],c=Math.max(0,Math.min(100,coward)),r=document.getElementById('result');r.classList.add('show');r.innerHTML='<span class="badge">鉴定结果</span><div class="code">'+win.p+'</div><div class="subtitle">'+t.name+'</div><div class="punch">'+t.punch+'</div><div class="diag">'+t.desc+'<br><br><b>牛马委员会结论：</b>'+t.share+'</div><div class="meterbox"><div class="meterhead"><b>窝囊指数</b><span class="score">'+c+' / 100</span></div><div class="meter"><i style="width:'+c+'%"></i></div><div class="cowcopy">'+cowLabel(c)+'</div></div><button class="secondary" onclick="location.reload()">再测一次</button><div class="note">人格结果使用：选项人格权重 → 随机作答基线标准化（z-score）→ 特殊人格最低证据门槛。窝囊指数从 50 起步，按每个选项的行为增量累计，并限制在 0–100。</div>'}
render();
</script></body></html>
