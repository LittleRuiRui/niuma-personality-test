<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打工牛马 V2</title><style>
:root{--paper:#f8f0df;--ink:#241f1b;--pink:#f6a5bd;--yellow:#f6d16c;--blue:#c9e6ef;--green:#d8e7be}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;background-image:radial-gradient(#c8bba4 0.7px,transparent .7px);background-size:9px 9px}
.wrap{width:min(760px,95vw);margin:18px auto 60px}.paper{background:#fffaf0;border:2px solid #28231f;border-radius:28px;box-shadow:8px 9px 0 #0002;overflow:hidden}.screen{display:none}.screen.on{display:block}.home{padding:26px;text-align:center;position:relative}.stamp{display:inline-block;border:2px solid;border-radius:14px;padding:8px 12px;font-weight:900;transform:rotate(-2deg);background:#fff}.home h1{font-size:clamp(48px,11vw,82px);line-height:.95;margin:22px 0 8px;letter-spacing:-3px}.pink{color:#f27ca1;text-shadow:2px 2px 0 #222}.tag{display:inline-block;background:var(--yellow);padding:4px 10px;transform:rotate(-1deg);font-weight:900}.heroimg{width:min(390px,88%);display:block;margin:12px auto;border-radius:24px;mix-blend-mode:multiply}.btn{border:2px solid #222;border-radius:18px;background:var(--pink);padding:14px 22px;font-weight:900;font-size:18px;box-shadow:5px 5px 0 #222;cursor:pointer}.tiny{font-size:12px;color:#6e655b}.quiz{padding:20px}.top{display:flex;justify-content:space-between;font-weight:900}.bar{height:12px;border:2px solid;border-radius:20px;margin:8px 0 20px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink)}h2{font-size:clamp(23px,5vw,32px);line-height:1.45}.scene{border:2px solid;border-radius:22px;overflow:hidden;background:#eee2cd;margin:14px 0}.scene img{display:block;width:100%;mix-blend-mode:multiply}.fallback{height:190px;display:grid;place-items:center;font-size:70px;background:linear-gradient(160deg,#d7e7ed,#f3e5ca)}.answers{display:grid;gap:11px}.ans{border:2px solid #2b2622;border-radius:17px;background:#fffdf8;padding:14px;text-align:left;font-size:15.5px;line-height:1.55;font-weight:700;cursor:pointer}.ans:nth-child(4n+1){box-shadow:4px 4px 0 #f4abc1}.ans:nth-child(4n+2){box-shadow:4px 4px 0 #f4d36e}.ans:nth-child(4n+3){box-shadow:4px 4px 0 #b9ddea}.ans:nth-child(4n){box-shadow:4px 4px 0 #cfe0ad}.ans.sel{background:#ffe2ea}.letter{display:inline-grid;place-items:center;width:29px;height:29px;border:2px solid;border-radius:50%;margin-right:8px;background:#fff}.comment{display:none;margin-top:14px;padding:13px;border:2px dashed;border-radius:15px;background:#e7f0d7;font-weight:800}.comment.on{display:block}.next{display:none;margin:15px auto 0}.next.on{display:block}.result{padding:24px;text-align:center}.result h1{font-size:72px;margin:5px}.resultcard{padding:18px;border:2px solid;border-radius:20px;background:#ffe1e9;text-align:left;font-size:18px;line-height:1.7}.types{width:100%;border:2px solid;border-radius:18px;margin:18px 0;mix-blend-mode:multiply}.old{display:inline-block;margin-top:14px;color:#333}
@media(max-width:520px){.home{padding:20px}.quiz{padding:16px}.ans{font-size:14.5px}}
</style></head><body><main class="wrap">
<section id="home" class="screen on paper home"><div class="stamp">🐮 牛马国际评级委员会 · V2</div><h1>你是哪一种<br><span class="pink">打工牛马？</span></h1><p><span class="tag">12 道离谱但真实的职场现场</span></p><img class="heroimg" src="https://littleruirui.github.io/niuma-personality-test/assets/v2-hero.svg"><p><b>没有标准答案，只有不同的牛马人生。</b></p><button class="btn" onclick="start()">开始检查牛籍 →</button><p class="tiny">新版视觉实验 · 原版仍保留</p><a class="old" href="../">← 看原版</a></section>
<section id="quiz" class="screen paper quiz"><div class="top"><span id="num"></span><span>牛马档案 🗂</span></div><div class="bar"><i id="prog"></i></div><h2 id="q"></h2><div id="scene" class="scene"></div><div id="answers" class="answers"></div><div id="comment" class="comment"></div><button id="next" class="btn next" onclick="go()">下一题 →</button></section>
<section id="result" class="screen paper result"><div class="stamp">鉴定结果</div><h1 id="code">MESS</h1><h2 id="name">职场搅屎棍</h2><div id="resultcard" class="resultcard"></div><img class="types" src="https://littleruirui.github.io/niuma-personality-test/assets/v2-types.svg"><button class="btn" onclick="start()">再测一次</button><br><a class="old" href="../">← 返回原版</a></section></main>
<script>
const qs=[["老板凌晨 1:37 发来：“睡了吗？有个小事。”", ["立刻坐起来打开电脑。老板半夜还想到我，说明我至少是核心牛马。顺便回一句：“没睡老板，你说。”", "看到了，但决定明早 8:59 再回。睡眠是本人目前唯一没有被公司收购的资产，暂不接受恶意并购。", "先不回，截图发给同事：“他也找你了吗？”工作可以明天做，情报必须今晚确认。", "把“小事”两个字盯了三分钟。根据历史数据，小事平均涉及 4 个部门、17 封邮件和一个周末。先做风险评估。"]], ["公司裁员 30%。你活下来了。第二天老板把三个被裁同事的工作交给你。", ["先确认自己真的还在 payroll 上，再接活。活下来是一回事，继承遗产是另一回事。", "问老板：“那他们三个的工资……是不是也有一部分活下来了？”我主要关心资源是否同步迁移。", "把三个空工位拍下来发群里：“以前以为他们是同事，现在才知道他们是我的防火墙。”", "什么都没说，打开 Excel 重新算一遍时薪。算完以后发现自己其实被裁了 75%，只是肉身还在。"]], ["公司发了“完全匿名”的员工满意度调查，最后一题：请填写直属经理姓名。", ["前面骂了八页，看到这一题以后返回第一页，把 Strongly Disagree 全部改成 Neutral。", "继续填。部门、职级、入职年份、直属经理……很好，再问两题就可以直接叫我身份证号。", "全部选择非常满意。提交以后长舒一口气：今天又成功参与了一次企业民主。", "截图发同事：“这个匿名吗？”同事五分钟没回。突然觉得整个公司都不安全了。"]], ["公司安排周六“自愿参加”的 Team Building。邮件最后一行：Attendance will be noted.", ["报名。既然都牺牲周六了，至少我要拿到照片里最显眼的位置。", "先查天气，再查体温，再查自己有没有一个周五晚上可以突然出现的远房亲戚。", "不去。Attendance 可以 note，本人也会 note 公司周末占用情况，双方建立完整审计轨迹。", "主动问 HR：“不参加会怎样？”我要的不是答案，是看看“自愿”两个字到底有多大弹性。"]], ["老板在会上讲错了一个关键数字，而且讲得非常自信。", ["直接打断：“老板，这个数好像不是这样。”说完才想起来自己的试用期还没过。", "疯狂私聊：老板数字错了 / 老板 / 老板看微信。此刻你不是员工，是他的场外教练。", "什么都不说，默默翻到数据来源那页。会议结束前是错误，会议结束后是证据。", "发现错了，但决定再听一会儿。主要想知道一个错误数字在八个高级经理共同点头下能走多远。"]], ["老板说：“这个项目做好了，对你明年晋升很有帮助。”", ["“好的老板，我来。”回家已经开始幻想升职后的 LinkedIn title，项目甚至还没建文件夹。", "“可以，具体做到什么算做好？”本人已经过了靠想象力领取奖金的年龄，请把饼换算成 KPI。", "嘴上没问题，脑子里自动打开 Excel：加班小时 × 时薪 ÷ 晋升概率。算完评级垃圾级。", "“那这个项目 visibility 高吗？”活可以干，但必须确保正确的人知道是我干的。"]], ["公司宣布：今年奖金取消，但为了感谢大家，会送一份特别礼物。", ["第一反应不是礼物，是裁员。在这家公司待久以后 surprise 已自动被大脑翻译成风险事件。", "开始猜礼物值多少钱。若低于 S$50，本人将把感谢程度同比下调至 Negative Outlook。", "去问 HR：“可以不要礼物，折现吗？”对方笑了一下。你意识到自己问了一个不企业文化的问题。", "组织同事竞猜：帆布袋赔率 1.2，保温杯 1.5，CEO 手写感谢信 8.0。奖金自己创造。"]], ["你发现 AI 可以完成你 90% 的工作。", ["立刻做成 workflow。老板问效率怎么突然提高，我回答：“最近状态比较好。”", "告诉老板，推动全公司提效。五分钟后你已经在画自动化路线图，仿佛公司是你家的。", "保持原交付速度，把省下来的时间拿去吃饭、散步、看招聘软件。科技进步终于惠及劳动者。", "同时打开五个模型开会。公司以为雇了一个人，实际上来了一个小型咨询公司。"]], ["同事把老板意思完全理解反了，而且已经非常自信地开始执行。", ["马上提醒。现在不说，最后大概率会变成一句：“你当时既然知道，为什么没有 raise？”", "私聊：“你要不要再确认一下？”我已经尽到人类义务，剩下属于自然选择。", "本来准备提醒，但他刚刚说了一句“这个我很确定”。好的，那我突然也不是很确定了。", "再观察五分钟。不是希望出事，主要是事情已经发展到这里了，现在打断有点可惜。"]], ["你请两周假。休假前三天，公司 0 条消息。", ["太好了，终于有人学会尊重边界。第四天继续睡到自然醒。", "先开心两小时，然后打开邮箱确认自己还在通讯录里。", "开始怀疑公司是不是在没有你的情况下运转得太好了，这个信息对职业安全不太友好。", "打开 LinkedIn 看看自己是不是已经离职。毕竟真正的安静往往发生在权限被收回以后。"]], ["你已经第 47 次决定辞职。", ["更新简历、算存款、打开招聘软件。流程已经非常成熟，唯一缺的是发送。", "把辞职信改名 resignation_final_v12_这次真的.docx，然后郑重地关掉电脑。", "先去看今天有没有工资到账。有的话，情绪自动从“我要走”修复到“再看看”。", "和同事宣布：“我最多再待三个月。”同事翻出你两年前发过一模一样的话。"]], ["你中了 S$10 million。第二天 9:03，老板：“Hi, are you online?”", ["“Sorry boss, just saw this.”财富自由暂时没能覆盖条件反射。", "已读。把手机扣过去。第一次感受到“不回复”原来也是一种资产配置。", "回一句：“什么事？”不是缺这份工作，主要是想听听他还能有什么事。", "“哪位？”发出去以后，工牌在抽屉里自行失去法律效力。"]]];let i=0,picks=[];
const comments=["委员会记录：这不是选择题，这是工伤鉴定。","已记录。您的职业人格正在缓慢暴露。","非常合理。合理得让 HR 有一点不安。","收到。证据已存档，请继续作答。"];function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on');scrollTo(0,0)}function start(){i=0;picks=[];show('quiz');render()}function render(){num.textContent=String(i+1).padStart(2,'0')+' / 12';prog.style.width=(i/12*100)+'%';q.textContent=qs[i][0];scene.innerHTML=i===0?'<img src="https://littleruirui.github.io/niuma-personality-test/assets/v2-q1.svg">':'<div class="fallback">'+['🔥🐮🍿','✂️🐮💻','📝🐮👀','🏕️🐮📎','📊🐮😶','🥧🐮📈','🎁🐮💸','🤖🐮☕','🔥🐮🍿','🏖️🐮📵','📄🐮🚪','💰🐮📱'][i]+'</div>';answers.innerHTML='';qs[i][1].forEach((t,j)=>{let b=document.createElement('button');b.className='ans';b.innerHTML='<span class="letter">'+String.fromCharCode(65+j)+'</span>'+t;b.onclick=()=>pick(j,b);answers.appendChild(b)});comment.className='comment';next.className='btn next'}function pick(j,b){if(document.querySelector('.ans.sel'))return;picks.push(j);document.querySelectorAll('.ans').forEach(x=>x.disabled=true);b.classList.add('sel');comment.textContent='🐮 '+comments[(i+j)%comments.length];comment.className='comment on';next.textContent=i===11?'提交牛籍 →':'下一题 →';next.className='btn next on'}function go(){i++;if(i<12)render();else finish()}function finish(){let c=[0,0,0,0];picks.forEach(x=>c[x]++);let m=c.indexOf(Math.max(...c));let r=[['BULL','职场紫微星','你面对荒谬职场的第一反应仍然是：先做点什么。努力是真的，命好有时也是真的。你可能是那种接到烂项目，最后项目莫名其妙变成战略重点的人。'],['FAKE','职场伪人','你最大的职业技能不是 Excel，而是让真实情绪永远停留在草稿箱。别人看到的是 Professional，你自己知道后台到底运行了什么。'],['FISH','摸鱼大师','你非常清楚公司买的是工作结果，不是你的全部人生。能解决就解决，不能解决就先吃饭。你的灵魂目前仍保有部分自主产权。'],['MESS','职场搅屎棍','你不是主动制造事故的人。你只是偶尔觉得：事情已经发展到这里了，现在阻止有点可惜。公司越乱，你的观察力越强。']][m];code.textContent=r[0];name.textContent=r[1];resultcard.textContent=r[2];show('result')}</script></body></html>
