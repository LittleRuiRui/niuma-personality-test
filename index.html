border-radius:999px;overflow:hidden;background:#fff}.progress i{display:block;height:100%;background:var(--pink);transition:.25s}.question{font-size:clamp(23px,5vw,32px);line-height:1.45;margin:22px 4px 14px}.scene{height:210px;border:2px solid var(--ink);border-radius:22px;background:#f5eddc;position:relative;overflow:hidden;margin-bottom:16px}.scene .cow{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:100px}.obj{position:absolute;bottom:22px;font-size:50px}.o1{left:18px}.o2{right:18px}.bubble{position:absolute;top:15px;right:14px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:9px 12px;font-size:14px;font-weight:900;max-width:52%;transform:rotate(2deg)}.choices{display:grid;gap:11px}.choice{width:100%;border:2px solid var(--ink);background:#fffdf8;border-radius:18px;padding:14px 15px;text-align:left;font-size:16px;font-weight:800;line-height:1.5;cursor:pointer;box-shadow:2px 3px 0 rgba(43,41,37,.11)}.choice:hover{background:#fff8cf;transform:translateX(3px)}.letter{display:inline-grid;place-items:center;width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;margin-right:8px;background:var(--yellow)}.choice.selected{background:#ffd6e4}.reaction{display:none;margin-top:14px;border:2px dashed var(--ink);border-radius:17px;padding:13px 14px;background:#e8f5dc;font-size:15px;font-weight:900;line-height:1.5}.reaction.show{display:block}.nextbtn{display:none;margin:15px auto 2px;border:2px solid var(--ink);background:var(--yellow);border-radius:16px;padding:11px 18px;font-weight:1000;cursor:pointer}.nextbtn.show{display:block}.loading{text-align:center;padding:65px 20px}.loadercow{font-size:100px;animation:bob 1.1s infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}.result{padding:22px}.result-head{text-align:center}.result-code{font-size:clamp(58px,16vw,105px);font-weight:1000;display:inline-block;background:linear-gradient(transparent 60%,#f8aec7 60% 88%,transparent 88%);transform:rotate(-2deg)}.result h2{font-size:clamp(28px,7vw,43px);margin:3px 0}.result-scene{height:260px;margin:16px 0 18px;border:2px solid var(--ink);border-radius:22px;position:relative;overflow:hidden;background:#f4e7d2}.result-scene .cow{position:absolute;font-size:125px;left:50%;bottom:22px;transform:translateX(-50%)}.chaos{position:absolute;inset:0;font-size:45px;display:flex;align-items:flex-end;justify-content:space-around;padding:0 14px 28px}.speech{position:absolute;right:14px;top:14px;max-width:48%;background:#fff;border:2px solid var(--ink);padding:10px 12px;border-radius:18px;font-weight:1000}.punch{background:#ffd9e5;border:2px solid var(--ink);border-radius:20px;padding:17px;font-size:20px;font-weight:1000;line-height:1.55;text-align:center}.profile{margin:16px 0;font-size:16px;line-height:1.9;font-weight:650}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:2px solid var(--ink);border-radius:15px;background:#fff;padding:12px;text-align:center;font-size:13px}.mini:nth-child(1){background:#ffe4ec}.mini:nth-child(2){background:#fff2ae}.mini:nth-child(3){background:#dff1fb}.mini b{display:block;font-size:15px;margin-bottom:7px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.secondary{border:2px solid var(--ink);background:#fff;border-radius:16px;padding:11px 15px;font-weight:900;cursor:pointer}.share{background:var(--pink)}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:25px}@media(max-width:520px){.mini-grid{grid-template-columns:1fr}.scene{height:190px}.result-scene{height:230px}}</style></head><body><main class="app"><section id="home" class="screen active paper home"><div class="stamp">🐮 牛马国际评级委员会</div><h1>你是哪一种<br><span class="marker">打工牛马？</span></h1><p class="subtitle">12 道灵魂拷问，测测你的职业精神状态。<br><span class="small">不准想太多，凭直觉选。想太久说明你还在上班。</span></p><div class="hero">🐮💻☕</div><button class="mainbtn" onclick="startQuiz()">开始检查牛籍 →</button><p class="small">免费 · 不存隐私 · HR 暂未获得接口权限</p></section><section id="quiz" class="screen paper quizwrap"><div class="topline"><span id="qnum"></span><span>🗂 牛马档案</span></div><div class="progress"><i id="progress"></i></div><h2 id="qtext" class="question"></h2><div id="scene" class="scene"></div><div id="choices" class="choices"></div><div id="reaction" class="reaction"></div><button id="next" class="nextbtn" onclick="nextQuestion()">下一题 →</button></section><section id="loading" class="screen paper loading"><div class="loadercow">🐮</div><h2>牛马国际评级委员会<br>正在核实您的牛籍...</h2><p>正在调取 Teams 绿点、厕所停留时间和未发送的辞职信。</p></section><section id="result" class="screen paper result"></section></main><script>const types=['BULL','MAMA','DOGE','FISH','POOR','QUIT','DEAD','FAKE','MESS','BOSS','AIYA','FREE'],score=Object.fromEntries(types.map(t=>[t,0]));let qi=0,locked=false;const qs=[{q:'老板凌晨 1:37 发：“睡了吗？”',s:['🛏️','📱','老板：睡了吗？'],a:[['“没呢老板！”','DOGE','身体已经睡了，工牌把你叫醒了。'],['手机扣过去。死人是不会回消息的。','DEAD','很好。您的灵魂已启用飞行模式。'],['打了八行脏话，删掉，回复：“Sure 😊”','FAKE','情绪稳定。主要因为真实情绪没有发送。'],['截图发朋友：“你看这个畜生。”','QUIT','辞职进度 +1。明早仍会打卡。']]},{q:'明明一句话可以阻止事故，但你决定——',s:['🔥','🍿','再观察五分钟…'],a:[['赶紧说。','MAMA','您成功阻止事故，同时喜提后续收尾。'],['私聊提醒一下。','FAKE','既保全世界，也保全自己的聊天记录。'],['跟我有什么关系。','FISH','责任边界清晰。HR 看了会沉默。'],['再观察五分钟。','MESS','恭喜。事故还没结束，您的精神已经好了。']]},{q:'HR：“今年没有奖金，但公司给大家准备了一份特别礼物。”',s:['🎁','💸','惊喜哦～'],a:[['我不要特别，我要奖金。','POOR','您对企业文化的理解非常现金流。'],['“哇谢谢公司😊” 然后去厕所骂十五分钟。','FAKE','标准职业伪人双系统运行正常。'],['先问：礼物能卖吗？','POOR','资产处置意识极强。'],['打开 LinkedIn。巧了，我也有礼物。','QUIT','公司送礼，您送离职意向。']]},{q:'两个部门已经开始互相抄送老板。',s:['📧','🍿','CC: 全世界'],a:[['关邮件。今天不适合识字。','FISH','风险控制：不看，就暂时不存在。'],['逐封阅读，生怕漏掉剧情。','MESS','您的 KPI 没动，瞳孔放大了。'],['“大家先冷静，我来整理一下。”','MAMA','很遗憾，您又成为了家长。'],['私聊一句：“我本来不想说的，但是……”','MESS','本机构无法证明火是您点的。']]},{q:'同事：“可以帮我简单看一下 PPT 吗？”',s:['📊','🧃','简单看一下'],a:[['“看了，挺好的。”（没打开）','FISH','审核完成。耗时 0.4 秒。'],['改完了，还顺手统一了字体。','MAMA','您只是想帮忙，最后又养了一个。'],['发给 AI：“这是我同事，你教育一下。”','AIYA','公司又多了一个隐形员工。'],['两小时后：怎么变成我的活了？','MAMA','欢迎回来，部门妈妈。']]},{q:'老板说：“这个项目很有 visibility。”',s:['🎯','🪤','高 visibility
