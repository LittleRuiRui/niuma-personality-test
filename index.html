let i=0,s=[0,0,0,0,0,0];function start(){intro.classList.add('hidden');quiz.classList.remove('hidden');render()}function render(){bar.style.width=(i/qs.length*100)+'%';let x=qs[i];card.innerHTML=`<div class=qnum>QUESTION ${i+1} / ${qs.length} · 牛马尽调进行中</div><h2>${x[0]}</h2><div class=choices>${x[1].map((a,j)=>`<button class=choice onclick="pick(${j})"><b>${'ABCDE'[j]}</b>${a[0]}</button>`).join('')}</div><div class=aside>${i%3===0?'* 本题不存在正确答案，因为上班本身可能就是错误答案。':''}</div>`}function pick(j){qs[i][1][j][1].forEach((v,k)=>s[k]+=v);i++;if(i<qs.length)render();else finish()}function finish(){quiz.classList.add('hidden');let exit=s[4],ai=s[5],eff=s[2],pol=s[3],comp=s[1],amb=s[0];let idx=0;if(exit>34&&comp<0)idx=11;else if(exit>30&&amb>25)idx=6;else if(ai>20)idx=7;else if(pol>25)idx=8;else if(eff>28&&exit<25)idx=0;else if(exit>25)idx=2;else if(comp>35)idx=9;else if(eff>24)idx=4;else if(comp<0)idx=10;else if(amb>30)idx=1;else idx=3;let t=types[idx];let risk=Math.max(5,Math.min(99,Math.round(45+exit*1.4-comp*.45)));let grade=risk>88?'D':risk>76?'CCC':risk>63?'BB-':risk>48?'BBB':risk>32?'A-':'AA+';let outlook=risk>85?'肉体尚在，精神已注销':risk>68?'裸辞观察名单':risk>50?'人还在，心不好说':risk>35?'稳定摸鱼':'持续经营';let vals=s.map((v,k)=>Math.max(3,Math.min(99,Math.round(45+v*1.7))));let cs=[...comments].sort(()=>Math.random()-.5).slice(0,6);result.classList.remove('hidden');result.innerHTML=`<div class="panel center"><div class=badge>检测完成 · 系统暂未报警</div><h2 class=title>${t[0]}</h2><div class=en>${t[1]}</div><p style="font-size:19px;font-weight:800;line-height:1.7">${t[2]}</p><div class=rating><span>牛马主体评级 · Corporate Livestock Rating</span><br><strong>${grade}</strong><b>评级展望：${outlook}</b><p>12个月精神违约概率：${risk}%</p></div><div class=stats>${D.map((d,k)=>`<div class=stat><b>${d}　${vals[k]}%</b><div class=meter><i style="width:${vals[k]}%"></i></div></div>`).join('')}</div><div class=comments>${cs.map(c=>`<div class=comment><b>【${c[0]}】</b>${c[1]}</div>`).join('')}</div><div class=hook><h3>系统还发现了一件不太妙的事</h3><p
