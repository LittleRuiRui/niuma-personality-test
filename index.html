function cowMarkup(){return '<div class="scene-cow"><div class="ear l"></div><div class="ear r"></div><div class="horn l"></div><div class="horn r"></div><div class="cowhead"><div class="spot"></div><div class="eyelid l"></div><div class="eyelid r"></div><div class="eye l"></div><div class="eye r"></div><div class="snout"></div></div></div>'}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function startQuiz(){qi=0;score=Object.fromEntries(types.map(t=>[t,0]));show('quiz');renderQ()}
function renderQ(){locked=false;const q=qs[qi];qnum.textContent=String(qi+1).padStart(2,'0')+' / '+qs.length;progress.style.width=((qi)/qs.length*100)+'%';qtext.textContent=q.q;scene.innerHTML='<div class="caption">'+q.scene[2]+'</div><div class="scene-floor"></div><div class="scene-prop p1">'+q.scene[0]+'</div><div class="scene-prop p2">'+q.scene[1]+'</div>'+cowMarkup()+'<div class="bubble">'+q.scene[3]+'</div>';choices.innerHTML='';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+a[0]+'</span>';b.addEventListener('click',()=>choose(i,b));choices.appendChild(b)});reaction.className='reaction';next.className='nextbtn'}
function choose(i,b){if(locked)return;locked=true;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add('selected');const a=qs[qi].a[i];a[1].forEach(([t,w])=>score[t]+=w);reaction.textContent='🐮 委员会短评：'+a[2];reaction.className='reaction show';next.textContent=qi===qs.length-1?'提交牛籍 →':'下一题 →';next.className='nextbtn show'}
function nextQuestion(){qi++;qi<qs.length?renderQ():finish()}
function finish(){show('loading');setTimeout(()=>{const max=Math.max(...types.map(t=>score[t]));const tied=types.filter(t=>score[t]===max);const t=tied[Math.floor(Math.random()*tied.length)];renderResult(t);show('result')},900)}
function renderResult(t){const r=R[t];result.innerHTML='<div class="result-head"><b>鉴定结果</b><div class="result-code">'+t+'</div><h2>'+r[0]+'</h2></div><div class="result-scene"><div class="scene-floor"></div><div class="result-icons">'+r[6]+'</div>'+cowMarkup()+'<div class="speech">'+r[7]+'</div></div><div class="punch">'+r[1]+'</div><div class="profile">'+r[2]+'</div><div class="mini-grid"><div class="mini"><b>牛马评级</b>'+r[3]+'</div><div class="mini"><b>主要风险</b>'+r[4]+'</div><div class="mini"><b>同事评价</b>'+r[5]+'</div></div><div class="gallery"><div class="gallery-title">全部牛马图鉴（12 种）</div><div class="typechips">'+types.map(x=>'<div class="chip"><strong>'+x+'</strong>'+R[x][0]+'</div>').join('')+'</div><div class="notice">纯属娱乐。如有雷同，说明大家上的可能是同一种班。</div></div><div class="actions"><button class="secondary" onclick="startQuiz()">↻ 再测一次</button><button class="secondary share" onclick="shareResult(\''+t+'\')">分享给同类 →</button></div><div class="foot">牛马国际评级委员会 · Corporate Livestock Ratings · 本机构不对突然离职负责</div>'}
async function shareResult(t){const r=R[t],text='我测出来是 '+t+'｜'+r[0]+'\n'+r[1]+'\n你是哪一种打工牛马？';if(navigator.share){try{await navigator.share({title:'你是哪一种打工牛马？',text,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(text+'\n'+location.href);alert('结果已复制。去群里寻找同类吧 🐮')}catch(e){alert(text)}}
</script>
